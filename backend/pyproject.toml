[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "An accountable multi-agent software engineering system integrated with GitHub."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AgentForge Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.100.0",
]

[project.optional-dependencies]
sandbox = [
    "docker>=7.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
security = [
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["agentforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "requires_docker: marks tests that require a running Docker daemon (deselect with -m 'not requires_docker')",
]
