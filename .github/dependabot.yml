version: 2

updates:
  # -----------------------------------------------------------------------
  # Python (pip) dependencies
  # -----------------------------------------------------------------------
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    reviewers:
      - vansh070605
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    # Group sandbox-related updates into a single PR
    groups:
      sandbox-deps:
        patterns:
          - "docker"
        update-types:
          - "minor"
          - "patch"
      security-tools:
        patterns:
          - "bandit"
          - "pip-audit"
        update-types:
          - "minor"
          - "patch"
      core-deps:
        patterns:
          - "pydantic"
          - "fastapi"
          - "httpx"
        update-types:
          - "patch"
    # Ignore major version bumps — these are reviewed manually
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # -----------------------------------------------------------------------
  # GitHub Actions
  # -----------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    reviewers:
      - vansh070605
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # -----------------------------------------------------------------------
  # Docker base image — agentforge/sandbox/Dockerfile
  # -----------------------------------------------------------------------
  - package-ecosystem: docker
    directory: "/agentforge/sandbox"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    reviewers:
      - vansh070605
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "chore(docker)"
