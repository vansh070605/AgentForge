name: CI — Unit & Integration Tests

on:
  push:
    branches: ["main", "develop", "agentforge/**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "pytest (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # Use LocalSubprocessRuntime — no Docker daemon needed in this workflow
      AGENTFORGE_SANDBOX_DRIVER: local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify git is available (required by workspace tests)
        run: git --version

      - name: Configure git identity for test fixtures
        run: |
          git config --global user.email "ci@agentforge.local"
          git config --global user.name "AgentForge CI"

      - name: Run full test suite (excluding Docker integration tests)
        run: |
          pytest tests/ -v \
            -m "not requires_docker" \
            --tb=short \
            --junit-xml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: pytest-results.xml
          retention-days: 14

  lint:
    name: "Lint & Type Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff linter
        run: ruff check agentforge/ tests/

      - name: Run ruff formatter check
        run: ruff format --check agentforge/ tests/
