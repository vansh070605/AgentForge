name: Security Scan — SAST & Dependency Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "agentforge/**"
      - "pyproject.toml"
      - ".github/workflows/security_scan.yml"

  # Weekly scheduled CVE sweep
  schedule:
    - cron: "0 3 * * 3"  # Every Wednesday at 03:00 UTC

permissions:
  contents: read
  security-events: write  # Required to upload SARIF to GitHub Security tab

jobs:
  bandit-sast:
    name: "Bandit — Python SAST"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[sarif]>=1.7.0"

      - name: Run Bandit SAST scan
        run: |
          bandit -r agentforge/ \
            --severity-level medium \
            --confidence-level medium \
            --format sarif \
            --output bandit-results.sarif || true

      - name: Show Bandit summary (text)
        run: |
          bandit -r agentforge/ \
            --severity-level medium \
            --confidence-level medium \
            --format text || true

      - name: Upload Bandit SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/bandit-results.sarif
          category: bandit

      - name: Fail on HIGH severity findings
        run: |
          bandit -r agentforge/ \
            --severity-level high \
            --confidence-level high \
            --exit-zero=false

  pip-audit:
    name: "pip-audit — Dependency CVE Scan"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and audit tool
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sandbox]"
          pip install "pip-audit>=2.7.0"

      - name: Run pip-audit CVE scan
        run: |
          pip-audit \
            --format json \
            --output pip-audit-results.json \
            --progress-spinner off \
            . || true

      - name: Display audit results (human-readable)
        run: pip-audit --progress-spinner off . || true

      - name: Fail build on known vulnerabilities
        run: pip-audit --progress-spinner off --strict .

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: backend/pip-audit-results.json
          retention-days: 30

  security-gate:
    name: "Security Gate"
    runs-on: ubuntu-latest
    needs: [bandit-sast, pip-audit]
    if: always()

    steps:
      - name: Check security scan outcomes
        run: |
          if [ "${{ needs.bandit-sast.result }}" == "failure" ] || \
             [ "${{ needs.pip-audit.result }}" == "failure" ]; then
            echo "::error::Security scan failed. Review Bandit SAST and pip-audit results."
            exit 1
          fi
          echo "All security checks passed."
